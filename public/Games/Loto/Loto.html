        }
        // iOS / Chrome üçün preload
        Object.values(sounds).forEach(sound => {
            sound.preload = 'auto';
            sound.volume = 0.8;
        });
        function playSound(name) {
            if (isMuted) return Promise.resolve(null);

            const sound = sounds[name];
            if (!sound) {
                console.warn('Sound not found:', name);
                return Promise.resolve(null);
            }

            sound.currentTime = 0; // təkrar çalmaq üçün
            return sound.play().catch(() => {
                // autoplay policy fallback
                return null;
            });
        }
        function unlockAudio() {
            Object.values(sounds).forEach(sound => {
                sound.play()
                    .then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    })
                    .catch(() => { });
            });

            console.log("🔓 Audio unlocked");
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        function normalizeLanguage(lang) {
            if (!lang || typeof lang !== 'string') return 'en';
            const key = lang.trim().toLowerCase();
            const primary = key.split(/[-_]/)[0];
            if (['az', 'aze'].includes(key) || primary === 'az' || key.includes('azer')) return 'en';
            if (['en', 'eng', 'english'].includes(key) || primary === 'en') return 'en';
            if (['tr', 'tur', 'turkish', 'tr-tr'].includes(key) || primary === 'tr') return 'tr';
            if (['hi', 'hin', 'hindi', 'indian', 'india'].includes(key) || primary === 'hi' || primary === 'in') return 'hi';
            if (['ru', 'rus', 'russian', 'ru-ru'].includes(key) || primary === 'ru') return 'ru';
            if (['ar', 'ara', 'arabic', 'ar-sa', 'ar-ae'].includes(key) || primary === 'ar') return 'ar';
            if (['uz', 'uzb', 'uzbek', 'uz-uz'].includes(key) || primary === 'uz') return 'uz';
            return 'en';
        }

        function getInitialLanguage() {
            const params = new URLSearchParams(window.location.search);
            return normalizeLanguage(params.get('lang') || localStorage.getItem('app_language') || 'en');
        }

        function t(key, vars = {}) {
            const dict = translations[currentLanguage] || translations.en;
            let text = dict[key] || translations.en[key] || key;
            Object.keys(vars).forEach(k => {
                text = text.replace(`{${k}}`, vars[k]);
            });
            return text;
        }

        function applyLanguage(lang) {
            currentLanguage = normalizeLanguage(lang);
            document.documentElement.lang = currentLanguage;
            document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
            scheduleSpeechVoiceRefreshes();

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });

            // const winRuleEl = document.getElementById("winRuleBadge");
            // if (winRuleEl) {
            //     winRuleEl.textContent = translateWinRule(winRule);
            // }

            // renderTickets();
            renderClosestCardInsights();
        }

        function getSpeechLang() {
            return speechLangMap[currentLanguage] || 'en-US';
        }

        function refreshSpeechVoices() {
            if (!('speechSynthesis' in window)) return;
            speechVoices = window.speechSynthesis.getVoices() || [];
        }

        function scheduleSpeechVoiceRefreshes() {
            if (!('speechSynthesis' in window)) return;
            refreshSpeechVoices();
            [120, 450, 1000, 1800].forEach(delay => {
                setTimeout(refreshSpeechVoices, delay);
            });
        }

        function pickSpeechVoice(lang) {
            if (!('speechSynthesis' in window)) return null;
            if (!speechVoices || speechVoices.length === 0) {
                refreshSpeechVoices();
            }
            const voices = speechVoices;
            if (!voices || voices.length === 0) return null;
            const normalizedLang = lang.toLowerCase();
            const exact = voices.find(v => v.lang && v.lang.toLowerCase() === normalizedLang);
            if (exact) return exact;
            const prefix = normalizedLang.split('-')[0];
            const partial = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
            if (partial) return partial;
            return voices.find(v => v.default) || voices[0] || null;
        }

        function getSpeechConfig() {
            const requestedLang = getSpeechLang();
            const fallbackLangs = speechFallbackLangMap[currentLanguage] || ['en-US'];
            const candidates = [requestedLang, ...fallbackLangs].filter(Boolean);

            for (const lang of candidates) {
                const voice = pickSpeechVoice(lang);
                if (!voice) continue;

                const voiceLang = voice.lang || lang;
                const langPrefix = lang.split('-')[0].toLowerCase();
                const isLanguageMatch = voiceLang.toLowerCase().startsWith(langPrefix);

                return {
                    lang: isLanguageMatch ? lang : voiceLang,
                    voice
                };
            }

            return { lang: requestedLang, voice: null };
        }

        function unlockSpeechSynthesis() {
            if (!('speechSynthesis' in window) || isSpeechUnlocked) return;

            scheduleSpeechVoiceRefreshes();

            try {
                const config = getSpeechConfig();
                const utterance = new SpeechSynthesisUtterance(" ");
                utterance.lang = config.lang;
                utterance.volume = 0.01;
                utterance.rate = 1;
                utterance.pitch = 1;
                if (config.voice) {
                    utterance.voice = config.voice;
                }

                utterance.onend = () => {
                    activeSpeechUtterance = null;
                    if (pendingSpeechNumber !== null) {
                        const num = pendingSpeechNumber;
                        pendingSpeechNumber = null;
                        speakDrawnNumber(num);
                    }
                };
                utterance.onerror = (event) => {
                    activeSpeechUtterance = null;
                    const errorName = event?.error;
                    if (errorName !== "canceled" && errorName !== "interrupted") {
                        isSpeechUnlocked = false;
                    }
                };

                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();
                activeSpeechUtterance = utterance;
                window.speechSynthesis.speak(utterance);
                isSpeechUnlocked = true;
                setTimeout(() => {
                    window.speechSynthesis.resume();
                    if (pendingSpeechNumber !== null) {
                        const num = pendingSpeechNumber;
                        pendingSpeechNumber = null;
                        speakDrawnNumber(num);
                    }
                }, 260);
            } catch (err) {
                console.warn("Speech unlock failed:", err);
            }
        }

        function speakNow(num) {
            if (isMuted) return;
            if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
                console.warn("Speech synthesis is not supported in this browser");
                return;
            }
            if (!isSpeechUnlocked) {
                pendingSpeechNumber = num;
                return;
            }

            const config = getSpeechConfig();
            const utterance = new SpeechSynthesisUtterance(String(num));
            utterance.lang = config.lang;
            if (config.voice) {
                utterance.voice = config.voice;
            }
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onend = () => {
                activeSpeechUtterance = null;
            };
            utterance.onerror = (event) => {
                const errorName = event?.error;
                if (errorName !== "canceled" && errorName !== "interrupted") {
                    console.warn("Drawn number speech failed:", errorName || event);
                }
                activeSpeechUtterance = null;
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
            activeSpeechUtterance = utterance;
            window.speechSynthesis.speak(utterance);

            setTimeout(() => {
                if ('speechSynthesis' in window) {

                }
            }, 120);

        function speakDrawnNumber(num) {
            if (isMuted) return;
            if (!('speechSynthesis' in window)) return;
            let didSpeak = false;

            const trySpeak = () => {
                if (didSpeak) return;
                didSpeak = true;
                if (speechRetryTimer) {
                    clearTimeout(speechRetryTimer);
                    speechRetryTimer = null;
                }
                if (!speechVoices || speechVoices.length === 0) {
                    refreshSpeechVoices();
                }
                speakNow(num);
            };

            if (speechRetryTimer) {
                clearTimeout(speechRetryTimer);
                speechRetryTimer = null;
            }

            speechRetryTimer = setTimeout(trySpeak, 320);
        }

        function requestDrawnNumberSpeech(num) {

            sendToReact('SPEAK_DRAWN_NUMBER', {
                requestId,
                number: num,
                language: currentLanguage

            const fallbackTimer = setTimeout(() => {
                pendingParentSpeechRequests.delete(requestId);
                speakDrawnNumber(num);
            }, 1200);

            pendingParentSpeechRequests.set(requestId, fallbackTimer);

        function foldWinRuleText(rule) {
            return String(rule ?? '')
                .replace(/[Əə]/g, 'e')
                .replace(/[İIı]/g, 'i')
                .replace(/[Ğğ]/g, 'g')
                .replace(/[Öö]/g, 'o')
                .replace(/[Üü]/g, 'u')
                .replace(/[ŞşȘș]/g, 's')
                .replace(/[Çç]/g, 'c')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        function translateWinRule(rule) {
            if (!rule) return t('win_rule_entire_card');
            const foldedRule = foldWinRuleText(rule);
            if (
                foldedRule.includes('tam kart') ||
                foldedRule.includes('tum kart') ||
                foldedRule.includes('full card') ||
                foldedRule.includes('entire card') ||
                foldedRule.includes('whole card')
            ) {
                return t('win_rule_full_card');
            }
            if (
                foldedRule.includes('bir xett') ||
                foldedRule.includes('tek cizgi') ||
                foldedRule.includes('single line') ||
                foldedRule.includes('one line')
            ) {
                return t('win_rule_single_line');
            }
            return rule;
        }

            if (!token) {
                console.error('❌ [LOTO] Token yoxdur! SignalR yaradılmır');
                throw new Error('Token tapılmadı');
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl("https://api.xgame.game/lotoHub", {
                    accessTokenFactory: () => {
                        const t = getToken();
                        console.log('🎫 [LOTO] accessTokenFactory çağırıldı:', t ? 'Token göndərilir' : 'Token YOX!');
                        if (!t) {
                            console.error('❌ [LOTO] CRITICAL: Token null/empty!');
                        }
                        return t;
                    },
                    skipNegotiation: false,
                    transport: signalR.HttpTransportType.WebSockets | signalR.HttpTransportType.LongPolling,
                    withCredentials: false
                })
                .withAutomaticReconnect({
                    nextRetryDelayInMilliseconds: (retryContext) => {
                        if (retryContext.elapsedMilliseconds < 60000) {
                            return Math.random() * 10000;
                        } else {
                            return null;
                        }
                    }
                })
                .configureLogging(signalR.LogLevel.Debug)
                .build();

            setupHandlers();

                grid.innerHTML = `<p style='color: red; grid-column: 1/-1;'>${t('invalid_card')}</p>`;

        function parseClosestCardNumber(value) {
            if (typeof value === "number" && Number.isFinite(value)) return value;
            if (typeof value === "string" && value.trim() !== "") {
                const parsed = Number(value);
                if (Number.isFinite(parsed)) return parsed;
            }
            return null;
        }

        function readClosestCardMetric(source, keys) {
            if (!source || typeof source !== "object") return null;
            for (const key of keys) {
                const parsed = parseClosestCardNumber(source[key]);
                if (parsed !== null) return parsed;
            }
            return null;
        }

        function readClosestCardMetricByPattern(source, pattern) {
            if (!source || typeof source !== "object") return null;

            for (const [key, value] of Object.entries(source)) {
                if (!pattern.test(String(key))) continue;
                const parsed = parseClosestCardNumber(value);
                if (parsed !== null) return parsed;
            }

            return null;
        }

        function extractNumbersAway(source) {
            const direct = readClosestCardMetric(source, [
                "numbersAway",
                "numbersLeft",
                "numberLeft",
                "remainingNumbersCount",
                "remainingNumberCount",
                "remainingCount",
                "remaining",
                "numbersNeeded",
                "neededNumberCount",
                "neededNumbersCount",
                "missingCount",
                "missingNumbersCount",
                "waitingNumberCount",
                "waitingNumbersCount",
                "distance",
                "closestDistance"
            ]);

            if (direct !== null) return direct;

            const arrayKeys = [
                "remainingNumbers",
                "missingNumbers",
                "numbersNeededList",
                "neededNumbers",
                "awaitingNumbers",
                "numbersToWin",
                "waitingNumbers",
                "leftNumbers"
            ];

            for (const key of arrayKeys) {
                if (Array.isArray(source?.[key])) {
                    return source[key].length;
                }
            }

            const guessed = readClosestCardMetricByPattern(
                source,
                /(number|num|digit|reqem|raqam|remain|left|wait|need|missing|away|distance)/i
            );

            if (guessed !== null) return guessed;

            return null;
        }

        function extractCardCount(source) {
            const direct = readClosestCardMetric(source, [
                "cardCount",
                "cardsCount",
                "closestCardCount",
                "closestCardsCount",
                "ticketCount",
                "ticketsCount",
                "playerCardCount",
                "count",
                "total",
                "totalCards"
            ]);

            if (direct !== null) return direct;

            const collectionKeys = ["cards", "tickets", "closestCards"];
            for (const key of collectionKeys) {
                if (Array.isArray(source?.[key])) {
                    return source[key].length;
                }
            }

            const guessed = readClosestCardMetricByPattern(
                source,
                /(card|ticket|kart|bilet)/i
            );

            if (guessed !== null) return guessed;

            return null;
        }

        function createClosestCardGroup(source) {
            if (!source || typeof source !== "object") return null;

            const numbersAway = extractNumbersAway(source);
            if (numbersAway === null) return null;

            return {
                numbersAway,
                cardCount: extractCardCount(source) ?? 1
            };
        }

        function collectClosestCardGroups(payload, depth = 0) {
            if (depth > 3 || payload == null) return [];

            if (Array.isArray(payload)) {
                return payload.flatMap((item) => collectClosestCardGroups(item, depth + 1));
            }

            if (typeof payload !== "object") {
                return [];
            }

            const directGroup = createClosestCardGroup(payload);
            if (directGroup) {
                return [directGroup];
            }

            const containerKeys = [
                "closestCards",
                "closestCardUpdates",
                "closest",
                "groups",
                "items",
                "data",
                "summary",
                "stats",
                "payload",
                "result"
            ];

            for (const key of containerKeys) {
                const nested = collectClosestCardGroups(payload[key], depth + 1);
                if (nested.length) {
                    return nested;
                }
            }

            for (const value of Object.values(payload)) {
                const nested = collectClosestCardGroups(value, depth + 1);
                if (nested.length) {
                    return nested;
                }
            }

            const groupedEntries = Object.entries(payload)
                .map(([key, value]) => {
                    const numbersAway = parseClosestCardNumber(key);
                    const cardCount = parseClosestCardNumber(value);

                    if (numbersAway !== null && cardCount !== null) {
                        return { numbersAway, cardCount };
                    }

                    if (numbersAway !== null && value && typeof value === "object") {
                        const nestedGroup = createClosestCardGroup(value);
                        if (nestedGroup) {
                            return {
                                numbersAway,
                                cardCount: nestedGroup.cardCount
                            };
                        }
                    }

                    return null;
                })
                .filter(Boolean);

            return groupedEntries;
        }

        function normalizeClosestCardGroups(payload) {
            const grouped = new Map();

            collectClosestCardGroups(payload).forEach((group) => {
                const numbersAway = Math.round(Number(group.numbersAway));
                const cardCount = Math.round(Number(group.cardCount));

                if (!Number.isFinite(numbersAway) || !Number.isFinite(cardCount)) return;
                if (numbersAway < 1 || cardCount < 1) return;

                grouped.set(numbersAway, (grouped.get(numbersAway) || 0) + cardCount);
            });

            return Array.from(grouped.entries())
                .map(([numbersAway, cardCount]) => ({ numbersAway, cardCount }))
                .sort((a, b) => a.numbersAway - b.numbersAway);
        }

        function renderClosestCardInsights() {
            const list = document.getElementById("closestCardPills");
            if (!list) return;

            if (!closestCardGroups.length) {
                if (closestCardRawPayload) {

                }
                list.innerHTML = "";
                list.hidden = true;
                list.classList.add("is-hidden");
                return;
            }

            list.hidden = false;
            list.classList.remove("is-hidden");
            list.innerHTML = "";

            closestCardGroups.forEach((group) => {
                const pill = document.createElement("span");
                pill.className = "closest-card-pill";
                if (group.numbersAway === 1) {
                    pill.classList.add("is-critical");
                }
                pill.textContent = t('closest_cards_pill_text', {
                    cards: group.cardCount,
                    numbers: group.numbersAway
                });
                list.appendChild(pill);
            });
        }

        function getManualSet(ticketId) {
            if (!manualMarks.has(ticketId)) {

        function isManuallyMarked(ticketId, val) {
            const set = manualMarks.get(ticketId);
            return set ? set.has(val) : false;
        }

        function toggleManualMark(ticketId, val) {
            const set = getManualSet(ticketId);
            if (set.has(val)) {
                set.delete(val);

            }
        }

                    autoText.setAttribute("data-i18n", translationKey);
                    autoText.textContent = t(translationKey);
                }
            }
            if (!enabled) {
                manualMarks.clear();
            }

        async function init() {
            console.log('🚀 [LOTO GAME] init() başladı');

            // Token yoxlaması
            const token = getToken();
            if (!token) {
                console.error('❌ [LOTO GAME] Token yoxdur!');
                showNotification(t('notification_missing_login'));
                return;
            }

            if (!currentRoomId) {
                console.error('❌ [LOTO GAME] RoomId yoxdur!');
                sendToReact('BACK_TO_LOBBY', {});
                return;
            }

            try {
                // Köhnə connection-u bağla
                if (connection) {
                    console.log("🔄 [LOTO GAME] Köhnə connection bağlanır...");
                    try {
                        await connection.stop();
                    } catch (e) {
                        console.log('Stop error (ignored):', e);
                    }
                    connection = null;
                }

                // Kiçik pause
                await new Promise(resolve => setTimeout(resolve, 200));

                console.log('✅ [LOTO] Token mövcuddur, connection yaradılır...');
                connection = createConnection();

                console.log("🔄 [LOTO GAME] SignalR.start() çağırılır...");
                await connection.start();

                // State yoxlama
                if (connection.state !== signalR.HubConnectionState.Connected) {
                    throw new Error('Connection Connected state-də deyil: ' + connection.state);
                }

                console.log("✅ [LOTO GAME] SignalR connected! State:", connection.state);

                console.log("🚪 [LOTO GAME] Joining room:", currentRoomId);
                await connection.invoke("JoinRoomView", currentRoomId);
                console.log("✅ [LOTO GAME] Room joined!");

                sendToReact('CONNECTION_SUCCESS', { roomId: currentRoomId });
                manageLoading();

            } catch (err) {
                console.error("❌ [LOTO GAME] Connection error:", err);
                console.error("❌ Error details:", err.message);
                console.error("❌ Stack:", err.stack);
                showNotification(t('notification_connection_error', { message: err.message }));
                sendToReact('CONNECTION_ERROR', { error: err.message });

                // Retry (optional - şərtli)
                if (!err.message.includes('Token')) {
                    setTimeout(() => {
                        console.log('🔄 Retry edilir...');
                        init();
                    }, 3000);
                }
            }
        }

        console.log('✅ [LOTO GAME] Script tam yükləndi, postMessage gözlənilir...');
